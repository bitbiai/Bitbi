# Fast path for direct-main homepage/UI-only and member-model exposure updates.
#
# This workflow intentionally keeps a narrow changed-file allowlist and fails
# closed for anything outside it. It is meant for low-risk static homepage
# polish, not backend, auth, billing, Worker, package, release, config, or
# workflow changes. Risky or mixed changes should use the full
# ".github/workflows/static.yml" Pages workflow.
#
# Fast-safe means every changed file is one of:
# - index.html or de/index.html
# - homepage CSS/static component CSS listed below
# - homepage JS under js/pages/index/**
# - local images/favicons/fonts
# - tests/smoke.spec.js
# - the narrowly owned member-model exposure/overlay files and focused parity
#   tests listed in scripts/lib/fast-deploy-paths.mjs
#
# Model registry and image-model configuration are intentionally excluded: they
# carry model-control, request-mode, pricing, or Worker-shared behavior and
# must stay on the broad static workflow.
#
# The push paths filter starts this workflow only for likely UI commits. The
# internal guard still compares all changed files because a mixed commit can
# include both an allowed UI file and a risky file. Mixed/risky changes fail
# before validation, before the Pages environment, and before Pages concurrency.
#
# Operator policy:
# - Normal UI work should use normal commits and `git push origin main`.
# - Avoid `git commit --amend` / force-push for routine UI deploys; if a push
#   base disappears, the guard will fall back to HEAD^ only when that is safe.
# - Manual workflow dispatch can intentionally redeploy current HEAD with
#   `allow_empty_deploy=true`.
# - For manual changed-file checks, provide a known previous commit SHA in
#   `base_ref`.

name: Fast UI and Member Models Deploy to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "de/index.html"
      - "css/pages/index.css"
      - "css/base/**"
      - "css/components/**"
      - "js/pages/index/**"
      - "assets/images/**"
      - "assets/favicons/**"
      - "fonts/**"
      - "js/shared/member-model-exposure.mjs"
      - "js/shared/models-overlay.js"
      - "tests/locale.spec.js"
      - "tests/smoke.spec.js"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional base ref/SHA for changed-file guard. Defaults to HEAD^."
        required: false
        default: ""
      allow_empty_deploy:
        description: "Allow an intentional manual redeploy when no changed files are found."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      ui_only: ${{ steps.changed-files.outputs.ui_only }}
      base_ref: ${{ steps.changed-files.outputs.base_ref }}
      head_ref: ${{ steps.changed-files.outputs.head_ref }}
      empty_deploy: ${{ steps.changed-files.outputs.empty_deploy }}
      homepage: ${{ steps.selection.outputs.homepage }}
      member_models: ${{ steps.selection.outputs.member_models }}
      carousel: ${{ steps.selection.outputs.carousel }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js for test selection
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Guard changed files are fast-path safe
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          MANUAL_BASE: ${{ github.event.inputs.base_ref }}
          ALLOW_EMPTY_DEPLOY: ${{ github.event.inputs.allow_empty_deploy || 'false' }}
        run: |
          set -euo pipefail

          is_truthy() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|Yes) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_zero_sha() {
            [ -z "${1:-}" ] || echo "$1" | grep -Eq '^0+$'
          }

          is_valid_commit() {
            [ -n "${1:-}" ] && git cat-file -e "$1^{commit}" 2>/dev/null
          }

          fail_friendly() {
            echo "::error::$1"
            echo "$1"
            exit 1
          }

          FALLBACK_USED="false"
          EMPTY_DEPLOY="false"
          ALLOW_EMPTY="false"
          if is_truthy "$ALLOW_EMPTY_DEPLOY"; then
            ALLOW_EMPTY="true"
          fi

          HEAD_REF="$PUSH_HEAD"
          if ! is_valid_commit "$HEAD_REF"; then
            fail_friendly "Fast UI deploy cannot validate head ref '$HEAD_REF'. Re-run after checkout has full history or use the full static workflow."
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${MANUAL_BASE:-}" ]; then
              BASE_REF="$MANUAL_BASE"
              if ! is_valid_commit "$BASE_REF"; then
                fail_friendly "Manual Fast UI deploy base_ref '$BASE_REF' is not a valid commit in this checkout. Provide a known previous commit SHA or rerun with allow_empty_deploy=true only for an intentional current-HEAD redeploy."
              fi
            elif is_valid_commit "HEAD^"; then
              BASE_REF="HEAD^"
            elif [ "$ALLOW_EMPTY" = "true" ]; then
              BASE_REF="$HEAD_REF"
              EMPTY_DEPLOY="true"
            else
              fail_friendly "Manual Fast UI deploy could not find a valid default base (HEAD^). Provide base_ref, or rerun with allow_empty_deploy=true to intentionally redeploy current HEAD."
            fi
          else
            BASE_REF="$PUSH_BASE"
            if is_zero_sha "$BASE_REF" || ! is_valid_commit "$BASE_REF"; then
              echo "::warning::Push base '$BASE_REF' is unavailable in this checkout. This can happen after amend/force-push. Falling back to HEAD^ if it is valid."
              if is_valid_commit "HEAD^"; then
                BASE_REF="HEAD^"
                FALLBACK_USED="true"
              else
                fail_friendly "Fast UI deploy cannot resolve push base '$PUSH_BASE' and HEAD^ is not available. Push a normal fast-safe commit, provide a manual base_ref through workflow_dispatch, or use the full static workflow."
              fi
            fi
          fi

          if ! is_valid_commit "$BASE_REF"; then
            fail_friendly "Fast UI deploy selected base ref '$BASE_REF', but it is not a valid commit. Provide a known previous commit SHA or use the full static workflow."
          fi

          echo "Changed-file guard"
          echo "- Event:                  $EVENT_NAME"
          echo "- Selected base ref:      $BASE_REF"
          echo "- Head ref:               $HEAD_REF"
          echo "- Fallback used:          $FALLBACK_USED"
          echo "- Allow empty deploy:     $ALLOW_EMPTY"
          echo "- Intentional empty run:  $EMPTY_DEPLOY"
          echo

          mapfile -t changed_files < <(git diff --name-only --no-renames "$BASE_REF" "$HEAD_REF" | sort)

          echo "Changed files (${#changed_files[@]}):"
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "- none"
          else
            printf -- '- %s\n' "${changed_files[@]}"
          fi
          echo

          if [ "${#changed_files[@]}" -eq 0 ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_EMPTY" = "true" ]; then
              EMPTY_DEPLOY="true"
              echo "No changed files were found. Continuing because this is an intentional manual empty redeploy."
            else
              fail_friendly "No changed files were found. For workflow_dispatch, provide base_ref or rerun with allow_empty_deploy=true for an intentional current-HEAD redeploy. Push events must contain a fast-safe diff."
            fi
          fi
          echo "- Intentional empty run after diff: $EMPTY_DEPLOY"
          echo

          if ! blocked_output="$(node scripts/check-ui-fast-deploy-paths.mjs "${changed_files[@]}" 2>&1)"; then
            echo "Fast UI deploy blocked. These files are outside the narrow fast-path allowlist:"
            while IFS= read -r blocked; do
              [ -n "$blocked" ] && printf -- '- %s\n' "$blocked"
            done <<< "$blocked_output"
            echo
            echo "Examples of paths intentionally blocked from this fast path:"
            echo "- workers/**, admin/**, account/**"
            echo "- js/shared/auth*, js/shared/wallet/**, js/pages/admin/**"
            echo "- package.json, package-lock.json, config/**, scripts/**"
            echo "- migrations/**, .github/workflows/**, _worker.js"
            echo "- billing/auth/provider/security/backend-related files"
            echo
            echo "Use the full static workflow for risky or mixed changes, or split the direct-main push into a fast-safe change."
            exit 1
          fi

          echo "All changed files are fast-path safe. Continuing with focused validation and Pages deploy."
          printf 'ui_only=true\n' >> "$GITHUB_OUTPUT"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'head_ref=%s\n' "$HEAD_REF" >> "$GITHUB_OUTPUT"
          printf 'empty_deploy=%s\n' "$EMPTY_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Select focused browser test suites
        id: selection
        env:
          FAST_UI_BASE_REF: ${{ steps.changed-files.outputs.base_ref }}
          FAST_UI_HEAD_REF: ${{ steps.changed-files.outputs.head_ref }}
        run: node scripts/select-ci-tests.mjs --base "$FAST_UI_BASE_REF" --head "$FAST_UI_HEAD_REF" --github-output

  # Short homepage feedback runs independently of the long browser regression.
  # Only native WebKit video moves to macOS; all other Linux gates remain.
  homepage-webkit-media:
    needs: guard
    runs-on: macos-15
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked test dependencies and WebKit
        run: |
          npm ci
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/homepage-browsers" npx playwright install webkit
      - name: Build the candidate static site
        run: npm run build:static
      - name: Run required native WebKit media with private HOME and loopback only
        run: |
          set -eu
          test "$(id -u)" -gt 0
          mkdir -p "$RUNNER_TEMP/homepage-home" "$RUNNER_TEMP/homepage-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/homepage-home" TMPDIR="$RUNNER_TEMP/homepage-tmp" CI=true GITHUB_SHA="$GITHUB_SHA" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/homepage-browsers" /usr/bin/sandbox-exec -f tests/helpers/homepage-macos.sb /bin/sh -c 'node scripts/check-homepage-runtime.mjs --macos && npm run test:homepage-webkit'
      - name: Upload mandatory macOS media evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: homepage-macos-media-${{ github.sha }}
          path: |
            test-results/homepage-runtime.json
            test-results/homepage-webkit.json
            test-results/homepage-webkit/
          retention-days: 7
          if-no-files-found: error

  homepage-validation:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Browser/dependency bytes match package-lock; no per-run apt upgrade.
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001:1001 --init --ipc=host --cap-drop=ALL --security-opt=no-new-privileges
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The image has Node 24; setup-node selects 22 from the runner-mounted
      # tool cache, whose non-root write access is checked before installation.
      npm_config_cache: /tmp/bitbi-homepage-npm
    if: needs.guard.outputs.ui_only == 'true'
    steps:
      - name: Prepare unprivileged tool paths
        run: |
          set -eu
          test "$(id -u)" = 1001
          test "$(id -g)" = 1001
          mkdir -p /tmp/bitbi-homepage-npm
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -w "$RUNNER_TOOL_CACHE"
          test -w "$HOME"
      - name: Report unselected homepage acceptance
        if: ${{ !(needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true') }}
        run: echo "Homepage acceptance is not selected for this change."
      - name: Checkout
        if: needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true'
        run: npm ci
      - name: Verify pinned browser image and unprivileged runtime
        if: needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true'
        run: npm run check:homepage-runtime
      - name: Build the candidate static site
        run: npm run build:static
      - name: Verify mandatory homepage discovery and coverage
        if: needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true'
        id: homepage_discovery
        run: npm run check:homepage-selection
      - name: Run Linux homepage functional acceptance
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run test:homepage-functional -- --max-failures=1
      - name: Record controlled homepage performance diagnostics
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run test:homepage-performance
      - name: Record bounded Linux WebKit media divergence (not acceptance)
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run diagnose:homepage-linux-media
      - name: Upload short homepage evidence
        if: always() && (needs.guard.outputs.homepage == 'true' || needs.guard.outputs.carousel == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: homepage-acceptance-${{ github.sha }}
          path: |
            test-results/homepage-*.json
            test-results/homepage-discovery-*/
            test-results/homepage-webkit/
            test-results/homepage-functional/
            test-results/homepage-linux-diagnostic/
            test-results/homepage-linux-diagnostic.log
            test-results/homepage-performance/
            playwright-report/homepage-webkit/
            playwright-report/homepage-functional/
            playwright-report/homepage-performance/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Validate and deploy fast-safe change
    needs: [guard, homepage-validation, homepage-webkit-media]
    if: needs.guard.outputs.ui_only == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Keep the shared production Pages lock only on the actual deploy job.
    # The guard job must never block the full workflow's Pages deploy queue.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    env:
      FAST_UI_BASE_REF: ${{ needs.guard.outputs.base_ref }}
      FAST_UI_HEAD_REF: ${{ needs.guard.outputs.head_ref }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Check committed secrets
        run: npm run check:secrets

      - name: Check DOM sink baseline
        run: npm run check:dom-sinks

      - name: Check auth route policy coverage
        run: npm run check:route-policies

      - name: Install carousel browser matrix
        if: needs.guard.outputs.carousel == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Chromium for selected focused tests
        if: needs.guard.outputs.carousel != 'true' && (needs.guard.outputs.homepage == 'true' || needs.guard.outputs.member_models == 'true')
        run: npx playwright install --with-deps chromium

      - name: Run homepage core tests
        if: needs.guard.outputs.homepage == 'true'
        run: npm run test:homepage-core

      - name: Run focused member model exposure tests
        if: needs.guard.outputs.member_models == 'true'
        run: >-
          npx playwright test -c playwright.config.js tests/smoke.spec.js tests/locale.spec.js
          --project=chromium --workers=1
          -g 'member model exposure is the sole Models overlay membership contract|Models overlay localizes desktop triggers on English and German homepages|Models overlay localizes mobile menu triggers and closes the mobile panel'

      - name: Run homepage carousel tests
        if: needs.guard.outputs.carousel == 'true'
        run: npm run test:homepage-carousel

      - name: Build static site
        id: static_build
        run: npm run build:static

      - name: Check diff whitespace
        run: git diff --check "$FAST_UI_BASE_REF" "$FAST_UI_HEAD_REF"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        if: success() && needs.guard.result == 'success' && steps.static_build.outcome == 'success' && steps.pages_artifact.outcome == 'success'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 1
