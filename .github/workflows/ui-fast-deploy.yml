# The historical Pages writer is retired. All current releases use static.yml
# and its authenticated local evidence; this manual wrapper never repeats suites.
name: Legacy Fast UI publication (retired)

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Retired: use npm run release:local with the verified base."
        required: false
        default: ""
      allow_empty_deploy:
        description: "Retired: protected current-candidate reuse belongs to static.yml."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the retired duplicate validation path
        run: |
          echo "::error::This Pages path is retired. Run npm run release:local on the development Mac; it prepares evidence and continues the existing static.yml workflow. No tests or deployment were executed here."
          exit 1
