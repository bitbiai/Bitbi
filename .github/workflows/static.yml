# Change-aware validation and deployment for GitHub Pages.
name: Deploy static content to Pages

on:
  # One artifact-producing publication owner for all static changes. The legacy
  # Fast UI path is manual-only during cutover and is fenced after retirement.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      frontend_recovery_receipt:
        description: "Protected recovery only: durable GitHub deployment receipt ID of the known frontend version."
        default: ""
      frontend_expected_deployment:
        description: "Exact current Cloudflare deployment ID before recovery."
        default: ""
      validation_only:
        description: "Validate this exact branch/commit without publication."
        type: boolean
        default: false
      release_plan_base_ref:
        description: "Optional wider release base; empty uses the last verified successful Pages deployment."
        required: false
        default: ""
      release_plan_dependency_acknowledgement:
        description: "Optional manual static deploy acknowledgement after release-plan Worker/schema dependencies are handled. Must equal I_CONFIRM_RELEASE_PLAN_DEPENDENCIES_HANDLED."
        required: false
        default: ""

      candidate_run_id:
        description: "Publish this completed scope-matched candidate run without repeating its suites (leave empty to validate)."
        required: false
        default: ""
      candidate_run_attempt:
        description: "Exact completed candidate attempt."
        required: false
        default: "1"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  deployments: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  release-compatibility:
    # Owner-approved draft evidence access; all other jobs keep their own rights.
    permissions:
      contents: write
      actions: read
      deployments: read
    if: ${{ !github.event.inputs.candidate_run_id && !github.event.inputs.frontend_recovery_receipt }}
    runs-on: ubuntu-latest
    outputs:
      browser_repair: ${{ steps.selection.outputs.browser_repair }}
      repair_source_sha: ${{ steps.selection.outputs.repair_source_sha }}
      repair_source_run: ${{ steps.selection.outputs.repair_source_run }}
      repair_source_attempt: ${{ steps.selection.outputs.repair_source_attempt }}
      hosting_provider: ${{ steps.hosting.outputs.provider }}
      candidate_base: ${{ steps.baseline.outputs.base }}
      pages_allowed: ${{ steps.release_preflight.outputs.static_deploy_allowed }}
      backend_continuation: ${{ steps.release_preflight.outputs.backend_continuation }}
      pages_required: ${{ steps.release_preflight.outputs.static_deploy_required }}
      docs_only: ${{ steps.selection.outputs.docs_only }}
      homepage: ${{ steps.selection.outputs.homepage }}
      carousel: ${{ steps.selection.outputs.carousel }}
      assets: ${{ steps.selection.outputs.assets }}
      workers: ${{ steps.selection.outputs.workers }}
      auth: ${{ steps.selection.outputs.auth }}
      admin_release: ${{ steps.selection.outputs.admin_release }}
      member_assets: ${{ steps.selection.outputs.member_assets }}
      public_media: ${{ steps.selection.outputs.public_media }}
      model_status: ${{ steps.selection.outputs.model_status }}
      model_areas: ${{ steps.selection.outputs.model_areas }}
      model_pricing: ${{ steps.selection.outputs.model_pricing }}
      image_models: ${{ steps.selection.outputs.image_models }}
      appearance: ${{ steps.selection.outputs.appearance }}
      canvas_text: ${{ steps.selection.outputs.canvas_text }}
      canvas_completion: ${{ steps.selection.outputs.canvas_completion }}
      canvas_audio: ${{ steps.selection.outputs.canvas_audio }}
      canvas_transitions: ${{ steps.selection.outputs.canvas_transitions }}
      canvas_export_repair: ${{ steps.selection.outputs.canvas_export_repair }}
      canvas_audio_fit: ${{ steps.selection.outputs.canvas_audio_fit }}
      canvas_examples: ${{ steps.selection.outputs.canvas_examples }}
      canvas_inspector: ${{ steps.selection.outputs.canvas_inspector }}
      media_lifecycle: ${{ steps.selection.outputs.media_lifecycle }}
      workspace_help: ${{ steps.selection.outputs.workspace_help }}
      dependencies: ${{ steps.selection.outputs.dependencies }}
      worker_dependencies: ${{ steps.selection.outputs.worker_dependencies }}
      static: ${{ steps.selection.outputs.static }}
      full: ${{ steps.selection.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Read hosting target
        id: hosting
        run: node scripts/frontend-release.mjs target
      - name: Resolve verified published Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
          RELEASE_BASE_INPUT: ${{ github.event.inputs.release_plan_base_ref }}
        run: node scripts/pages-candidate.mjs baseline
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Preflight complete static release plan
        id: release_preflight
        env:
          STATIC_DEPLOY_EVENT: ${{ github.event_name }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          STATIC_DEPLOY_BASE_REF: ${{ env.CANDIDATE_BASE }}
          STATIC_DEPLOY_HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run check:static-deploy-safety:github -- --backend-preflight --base "${STATIC_DEPLOY_BASE_REF:-}" --head "${STATIC_DEPLOY_HEAD_REF:-}" --event-name "$STATIC_DEPLOY_EVENT" --acknowledgement "$STATIC_DEPLOY_ACK"
      - name: Select tests from changed files
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          # Failed/skipped pushes remain in the unpublished range.
          CI_BASE_REF: ${{ env.CANDIDATE_BASE }}
          CI_HEAD_REF: ${{ github.sha }}
        run: node scripts/select-ci-tests.mjs --base "$CI_BASE_REF" --head "$CI_HEAD_REF" --github-output
      - name: Verify local release evidence and candidate bytes
        id: local_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/local-release.mjs import
      - name: Check committed artifact secrets
        run: npm run check:secrets
      - name: Upload immutable candidate build
        uses: actions/upload-artifact@v6
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve tested private media image
        if: steps.local_evidence.outputs.media_image == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: private-media-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/private-media-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  reuse-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_run_id != '' && !github.event.inputs.frontend_recovery_receipt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      artifact_ids: ${{ steps.source.outputs.artifact_ids }}
      backend_continuation: ${{ steps.release_preflight.outputs.backend_continuation }}
      hosting_provider: ${{ steps.hosting.outputs.provider }}
      candidate_base: ${{ steps.baseline.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Read hosting target
        id: hosting
        run: node scripts/frontend-release.mjs target
      - name: Resolve verified published Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
          RELEASE_BASE_INPUT: ${{ github.event.inputs.release_plan_base_ref }}
        run: node scripts/pages-candidate.mjs baseline
      - name: Preflight acknowledged full release
        id: release_preflight
        env:
          STATIC_DEPLOY_ACK: ${{ github.event.inputs.release_plan_dependency_acknowledgement }}
        run: node scripts/check-static-deploy-safety.mjs --base "$CANDIDATE_BASE" --head "$GITHUB_SHA" --event-name workflow_dispatch --acknowledgement "$STATIC_DEPLOY_ACK" --github-output --backend-preflight
      - name: Verify exact completed source acceptance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ github.event.inputs.candidate_run_attempt }}
        run: node scripts/pages-candidate.mjs source

  # Deployment remains gated by the release checks and every selected suite.
  deploy:
    permissions:
      contents: read
      actions: read
      deployments: write
      pages: write
      id-token: write
    needs: [release-compatibility, reuse-candidate]
    if: ${{ !cancelled() && !github.event.inputs.frontend_recovery_receipt && github.ref == 'refs/heads/main' && github.event.inputs.validation_only != 'true' && ((needs.reuse-candidate.result == 'success' && github.event.inputs.candidate_run_id != '') || (!github.event.inputs.candidate_run_id && (github.event_name == 'workflow_dispatch' || needs.release-compatibility.outputs.backend_continuation == 'true' || (needs.release-compatibility.outputs.pages_allowed == 'true' && needs.release-compatibility.outputs.pages_required == 'true')) && needs.release-compatibility.result == 'success')) }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    env:
      HOSTING_PROVIDER: ${{ needs.reuse-candidate.outputs.hosting_provider || needs.release-compatibility.outputs.hosting_provider }}
      CANDIDATE_BASE: ${{ needs.reuse-candidate.outputs.candidate_base || needs.release-compatibility.outputs.candidate_base }}
      REPAIR_SOURCE_SHA: ${{ needs.release-compatibility.outputs.repair_source_sha }}
      REPAIR_SOURCE_RUN: ${{ needs.release-compatibility.outputs.repair_source_run }}
      REPAIR_SOURCE_ATTEMPT: ${{ needs.release-compatibility.outputs.repair_source_attempt }}
      CANDIDATE_RUN: ${{ needs.release-compatibility.outputs.repair_source_run || github.event.inputs.candidate_run_id || github.run_id }}
      CANDIDATE_ATTEMPT: ${{ needs.release-compatibility.outputs.repair_source_attempt || (github.event.inputs.candidate_run_id && github.event.inputs.candidate_run_attempt) || github.run_attempt }}
    environment:
      name: ${{ (needs.reuse-candidate.outputs.hosting_provider || needs.release-compatibility.outputs.hosting_provider) == 'cloudflare' && 'cloudflare-static-production' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download selected completed candidate
        if: success() && needs.reuse-candidate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.reuse-candidate.outputs.artifact_ids }}
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          repository: bitbiai/Bitbi
          merge-multiple: true
          path: candidate
          digest-mismatch: error
      - name: Download this run's tested candidate
        if: success() && !github.event.inputs.candidate_run_id && env.REPAIR_SOURCE_SHA == ''
        uses: actions/download-artifact@v8
        with:
          pattern: pages-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: candidate
          digest-mismatch: error
      - name: Restore unchanged verified frontend package
        if: env.REPAIR_SOURCE_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/frontend-release.mjs production-source
      - name: Validate candidate references before backend publication
        run: node scripts/validate-site-references.mjs --root candidate/site
      - name: Apply verified candidate backend prerequisites
        if: success() && (needs.release-compatibility.outputs.backend_continuation == 'true' || needs.reuse-candidate.outputs.backend_continuation == 'true') && env.HOSTING_PROVIDER == 'cloudflare'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_BACKEND_DEPLOY_TOKEN }}
          MEMVID_STREAM_PREVIEW_PROCESSOR_SECRET: ${{ secrets.MEMVID_STREAM_PREVIEW_PROCESSOR_SECRET }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Protected CF_BACKEND_DEPLOY_TOKEN is missing"; exit 1; }
          npm --prefix workers/auth ci
          npm --prefix workers/media ci
          npm --prefix workers/ai ci
          npm --prefix workers/contact ci
          bash scripts/setup-media-tools.sh
          node scripts/release-apply.mjs --ci-verified-candidate
      - name: Preserve redacted backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/backend-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve backend activation evidence
        if: success() && env.BACKEND_RELEASE_RECEIPT != ''
        uses: actions/upload-artifact@v6
        with:
          name: backend-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/backend-release.json
          if-no-files-found: error
          retention-days: 90
      - name: Check static deploy release-plan safety
        id: static_safety
        env:
          CF_BACKEND_DEPLOY_TOKEN: ${{ secrets.CF_BACKEND_DEPLOY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
          STATIC_DEPLOY_EVENT: ${{ github.event_name }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          STATIC_DEPLOY_BASE_REF: ${{ env.CANDIDATE_BASE }}
          STATIC_DEPLOY_HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run check:static-deploy-safety:github -- --base "${STATIC_DEPLOY_BASE_REF:-}" --head "${STATIC_DEPLOY_HEAD_REF:-}" --event-name "$STATIC_DEPLOY_EVENT" --acknowledgement "$STATIC_DEPLOY_ACK"
      - name: Report skipped static deploy
        if: steps.static_safety.outputs.static_deploy_skipped == 'true'
        run: |
          echo "Static deploy skipped because release plan requires non-static deploy steps first."
          echo "Unsupported or unverified backend dependencies require their authorized release before frontend publication."
      - name: Report validation-only run
        if: steps.static_safety.outputs.static_deploy_skipped != 'true' && steps.static_safety.outputs.static_deploy_required != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Static deploy skipped because no GitHub Pages source changed."
      - name: Setup Pages
        if: env.HOSTING_PROVIDER == 'github-pages' && success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || (github.event_name == 'workflow_dispatch' && needs.release-compatibility.outputs.backend_continuation != 'true' && needs.reuse-candidate.outputs.backend_continuation != 'true'))
        uses: actions/configure-pages@v6
      - name: Validate local CSS/JS references
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || (github.event_name == 'workflow_dispatch' && needs.release-compatibility.outputs.backend_continuation != 'true' && needs.reuse-candidate.outputs.backend_continuation != 'true'))
        run: node scripts/validate-site-references.mjs --root candidate/site
      - name: Prepare deployment
        id: static_build
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || (github.event_name == 'workflow_dispatch' && needs.release-compatibility.outputs.backend_continuation != 'true' && needs.reuse-candidate.outputs.backend_continuation != 'true'))
        run: node scripts/pages-candidate.mjs publish
      - name: Upload artifact
        id: pages_artifact
        if: env.HOSTING_PROVIDER == 'github-pages' && success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || (github.event_name == 'workflow_dispatch' && needs.release-compatibility.outputs.backend_continuation != 'true' && needs.reuse-candidate.outputs.backend_continuation != 'true'))
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Refuse superseded or newly failed publication
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || (github.event_name == 'workflow_dispatch' && needs.release-compatibility.outputs.backend_continuation != 'true' && needs.reuse-candidate.outputs.backend_continuation != 'true')) && steps.static_build.outcome == 'success' && (env.HOSTING_PROVIDER == 'cloudflare' || steps.pages_artifact.outcome == 'success')
        env:
          CF_BACKEND_DEPLOY_TOKEN: ${{ secrets.CF_BACKEND_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
          CANDIDATE_ARTIFACT_IDS: ${{ needs.reuse-candidate.outputs.artifact_ids }}
          REUSED_CANDIDATE: ${{ github.event.inputs.candidate_run_id }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/check-static-deploy-safety.mjs --base "$CANDIDATE_BASE" --head "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" --acknowledgement "$STATIC_DEPLOY_ACK"
          if [ -n "$REUSED_CANDIDATE" ]; then
            node scripts/pages-candidate.mjs source
          else
            node scripts/pages-candidate.mjs current
          fi
      - name: Deploy to GitHub Pages
        if: env.HOSTING_PROVIDER == 'github-pages' && success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || (github.event_name == 'workflow_dispatch' && needs.release-compatibility.outputs.backend_continuation != 'true' && needs.reuse-candidate.outputs.backend_continuation != 'true')) && steps.static_build.outcome == 'success' && steps.pages_artifact.outcome == 'success'
        id: deployment
        # The official action checks this run's created deployment; its failure remains fatal.
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 1

      - name: Install pinned frontend deploy tooling
        if: success() && env.HOSTING_PROVIDER == 'cloudflare' && steps.static_build.outcome == 'success'
        run: npm --prefix workers/contact ci
      - name: Deploy and verify Cloudflare frontend
        if: success() && env.HOSTING_PROVIDER == 'cloudflare' && steps.static_build.outcome == 'success'
        env:
          CF_BACKEND_DEPLOY_TOKEN: ${{ secrets.CF_BACKEND_DEPLOY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
        run: node scripts/frontend-release.mjs deploy
      - name: Record durable frontend receipt
        if: success() && env.HOSTING_PROVIDER == 'cloudflare' && steps.static_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
        run: node scripts/frontend-release.mjs receipt
      - name: Preserve Cloudflare activation receipt
        if: success() && env.HOSTING_PROVIDER == 'cloudflare' && steps.static_build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosting-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed frontend upload identity
        if: failure() && !cancelled() && env.HOSTING_PROVIDER == 'cloudflare'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-failed-upload-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/frontend-upload.ndjson
          if-no-files-found: warn
          retention-days: 7

  recover-frontend:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.validation_only != 'true' && github.event.inputs.frontend_recovery_receipt != '' }}
    runs-on: ubuntu-latest
    environment: cloudflare-static-production
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned frontend recovery tooling
        run: npm --prefix workers/contact ci
      - name: Activate approved frontend recovery
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
          FRONTEND_RECOVERY_RECEIPT: ${{ github.event.inputs.frontend_recovery_receipt }}
          FRONTEND_EXPECTED_DEPLOYMENT: ${{ github.event.inputs.frontend_expected_deployment }}
        run: node scripts/frontend-release.mjs recover
      - name: Record durable frontend receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
        run: node scripts/frontend-release.mjs receipt
