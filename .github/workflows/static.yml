# Change-aware validation and deployment for GitHub Pages.
name: Deploy static content to Pages

on:
  # Homepage/UI-only and narrowly-owned member-model exposure pushes use the
  # fast workflow. Every other main push is classified below so unrelated
  # browser and Worker suites can be skipped.
  push:
    branches: ["main"]
    paths-ignore:
      - "index.html"
      - "de/index.html"
      - "css/pages/index.css"
      - "css/base/**"
      - "css/components/**"
      - "js/pages/index/**"
      - "assets/images/**"
      - "assets/favicons/**"
      - "fonts/**"
      - "js/shared/member-model-exposure.mjs"
      - "js/shared/models-overlay.js"
      - "tests/locale.spec.js"
      - "tests/smoke.spec.js"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_plan_base_ref:
        description: "Optional wider release base; empty uses the last verified successful Pages deployment."
        required: false
        default: ""
      release_plan_dependency_acknowledgement:
        description: "Optional manual static deploy acknowledgement after release-plan Worker/schema dependencies are handled. Must equal I_CONFIRM_RELEASE_PLAN_DEPENDENCIES_HANDLED."
        required: false
        default: ""

      candidate_run_id:
        description: "Publish this completed scope-matched candidate run without repeating its suites (leave empty to validate)."
        required: false
        default: ""
      candidate_run_attempt:
        description: "Exact completed candidate attempt."
        required: false
        default: "1"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  release-compatibility:
    if: ${{ !github.event.inputs.candidate_run_id }}
    runs-on: ubuntu-latest
    outputs:
      candidate_base: ${{ steps.baseline.outputs.base }}
      pages_allowed: ${{ steps.release_preflight.outputs.static_deploy_allowed }}
      pages_required: ${{ steps.release_preflight.outputs.static_deploy_required }}
      docs_only: ${{ steps.selection.outputs.docs_only }}
      homepage: ${{ steps.selection.outputs.homepage }}
      carousel: ${{ steps.selection.outputs.carousel }}
      assets: ${{ steps.selection.outputs.assets }}
      workers: ${{ steps.selection.outputs.workers }}
      auth: ${{ steps.selection.outputs.auth }}
      admin_release: ${{ steps.selection.outputs.admin_release }}
      dependencies: ${{ steps.selection.outputs.dependencies }}
      worker_dependencies: ${{ steps.selection.outputs.worker_dependencies }}
      static: ${{ steps.selection.outputs.static }}
      full: ${{ steps.selection.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Resolve verified published Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_INPUT: ${{ github.event.inputs.release_plan_base_ref }}
        run: node scripts/pages-candidate.mjs baseline
      - name: Install dependencies
        run: npm ci
      - name: Preflight complete static release plan
        id: release_preflight
        env:
          STATIC_DEPLOY_EVENT: ${{ github.event_name }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          STATIC_DEPLOY_BASE_REF: ${{ env.CANDIDATE_BASE }}
          STATIC_DEPLOY_HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run check:static-deploy-safety:github -- --base "${STATIC_DEPLOY_BASE_REF:-}" --head "${STATIC_DEPLOY_HEAD_REF:-}" --event-name "$STATIC_DEPLOY_EVENT" --acknowledgement "$STATIC_DEPLOY_ACK"
      - name: Select tests from changed files
        id: selection
        env:
          # Failed/skipped pushes remain in the unpublished range.
          CI_BASE_REF: ${{ env.CANDIDATE_BASE }}
          CI_HEAD_REF: ${{ github.sha }}
        run: node scripts/select-ci-tests.mjs --base "$CI_BASE_REF" --head "$CI_HEAD_REF" --github-output
      - name: Audit root dependencies
        if: steps.selection.outputs.dependencies == 'true'
        run: npm audit --audit-level=low
      - name: Validate worker package dependencies
        if: steps.selection.outputs.worker_dependencies == 'true'
        run: npm run check:worker-dependency-audits -- --install
      - name: Check toolchain pinning
        run: npm run check:toolchain
      - name: Run quality gate tests
        run: npm run test:quality-gates
      - name: Check committed secrets
        run: npm run check:secrets
      - name: Check DOM sink baseline
        run: npm run check:dom-sinks
      - name: Check auth route policy coverage
        run: npm run check:route-policies
      - name: Test operational readiness checks
        run: npm run test:operational-readiness
      - name: Check operational readiness docs
        run: npm run check:operational-readiness
      - name: Run live health check in skipped mode
        run: npm run check:live-health
      - name: Run live security header check in skipped mode
        run: npm run check:live-security-headers
      - name: Test live runtime canary skipped/safe mode
        run: npm run test:live-canary
      - name: Test release cutover evidence generator
        run: npm run test:release-cutover-evidence
      - name: Check targeted JavaScript syntax
        run: npm run check:js
      - name: Run release compatibility tests
        run: npm run test:release-compat
      - name: Run release planner tests
        run: npm run test:release-plan
      - name: Run static deploy safety tests
        run: npm run test:static-deploy-safety
      - name: Run CI test selection fixtures
        run: npm run test:ci-selection
      - name: Test mandatory homepage selection
        run: npm run test:homepage-selection
      - name: Run Cloudflare deploy prerequisite tests
        run: npm run test:cloudflare-prereqs
      - name: Run Cloudflare resource model tests
        run: npm run test:cloudflare-resource-model
      - name: Run readiness dossier tests
        run: npm run test:readiness-dossier
      - name: Run rollback drill tests
        run: npm run test:rollback-drill
      - name: Run Release Candidate manifest tests
        run: npm run test:release-rc
      - name: Run Release Candidate matrix tests
        run: npm run test:rc-check
      - name: Check Worker body parser guardrails
        run: npm run check:worker-body-parsers
      - name: Check admin activity query shape
        run: npm run check:admin-activity-query-shape
      - name: Check data lifecycle guardrails
        run: npm run check:data-lifecycle
      - name: Run doc currentness tests
        run: npm run test:doc-currentness
      - name: Check documentation currentness
        run: npm run check:doc-currentness
      - name: Run asset version tests
        run: npm run test:asset-version
      - name: Validate release compatibility
        run: npm run validate:release
      - name: Validate Cloudflare deploy prerequisites
        run: npm run validate:cloudflare-prereqs
      - name: Validate asset version sources
        run: npm run validate:asset-version

      - name: Record candidate build
        env:
          CANDIDATE_FULL: ${{ steps.selection.outputs.full }}
        run: |
          npm run build:static
          node scripts/pages-candidate.mjs record
      - name: Upload immutable candidate build
        uses: actions/upload-artifact@v6
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  worker-validation:
    needs: release-compatibility
    runs-on: ubuntu-latest
    env:
      # Explicit opt-in only on this disposable GitHub-hosted Linux test VM.
      Q2_RUNTIME_ALLOW_HOSTED_BOOTSTRAP: '1'
    steps:
      - name: Report skipped Worker tests
        if: needs.release-compatibility.outputs.workers != 'true'
        run: echo "Worker tests skipped because no Worker-related files changed."
      - name: Checkout
        if: needs.release-compatibility.outputs.workers == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.workers == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.release-compatibility.outputs.workers == 'true'
        run: npm ci
      - name: Install pinned Auth target-runtime test dependencies
        if: needs.release-compatibility.outputs.workers == 'true'
        run: npm --prefix workers/auth ci
      - name: Verify native Linux isolation before Worker tests
        if: needs.release-compatibility.outputs.workers == 'true'
        env:
          Q2_RUNTIME_ARTIFACTS: ${{ runner.temp }}/q2-runtime-evidence
        run: node scripts/test-q2-runtime.mjs --preflight
      - name: Run worker route tests
        if: needs.release-compatibility.outputs.workers == 'true'
        env:
          Q2_RUNTIME_ARTIFACTS: ${{ runner.temp }}/q2-runtime-evidence
        run: npm run test:workers
      - name: Upload native Linux acceptance evidence
        if: always() && needs.release-compatibility.outputs.workers == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: q2-linux-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/q2-runtime-evidence/
          retention-days: 7
          if-no-files-found: error

  # Short homepage feedback runs independently of the long browser regression.
  # Only native WebKit video moves to macOS; all other Linux gates remain.
  homepage-webkit-media:
    needs: release-compatibility
    runs-on: macos-15
    permissions:
      contents: read
    env:
      CANDIDATE_BASE: ${{ needs.release-compatibility.outputs.candidate_base }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Report unselected native WebKit acceptance
        if: ${{ !(needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true') }}
        run: echo "Native WebKit is unrelated to this release scope."
      - name: Checkout
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked test dependencies and WebKit
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: |
          npm ci
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/homepage-browsers" npx playwright install webkit
      - name: Download candidate build
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Restore exact candidate static site
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: node scripts/pages-candidate.mjs restore
      - name: Run required native WebKit media with private HOME and loopback only
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: |
          set -eu
          test "$(id -u)" -gt 0
          mkdir -p "$RUNNER_TEMP/homepage-home" "$RUNNER_TEMP/homepage-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/homepage-home" TMPDIR="$RUNNER_TEMP/homepage-tmp" CI=true GITHUB_SHA="$GITHUB_SHA" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/homepage-browsers" /usr/bin/sandbox-exec -f tests/helpers/homepage-macos.sb /bin/sh -c 'node scripts/check-homepage-runtime.mjs --macos && npm run test:homepage-webkit'
      - name: Confirm tested candidate bytes
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        env:
          CANDIDATE_REPORT: test-results/homepage-webkit.json
        run: node scripts/pages-candidate.mjs proof
      - name: Upload tested candidate identity
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pages-proof-homepage-webkit-media-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-proofs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload mandatory macOS media evidence
        if: always() && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: homepage-macos-media-${{ github.sha }}
          path: |
            test-results/homepage-runtime.json
            test-results/homepage-webkit.json
            test-results/homepage-webkit/
          retention-days: 7
          if-no-files-found: error

  homepage-validation:
    needs: release-compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Browser/dependency bytes match package-lock; no per-run apt upgrade.
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001:1001 --init --ipc=host --cap-drop=ALL --security-opt=no-new-privileges
    env:
      CANDIDATE_BASE: ${{ needs.release-compatibility.outputs.candidate_base }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The image has Node 24; setup-node selects 22 from the runner-mounted
      # tool cache, whose non-root write access is checked before installation.
      npm_config_cache: /tmp/bitbi-homepage-npm
    steps:
      - name: Prepare unprivileged tool paths
        run: |
          set -eu
          test "$(id -u)" = 1001
          test "$(id -g)" = 1001
          mkdir -p /tmp/bitbi-homepage-npm
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -w "$RUNNER_TOOL_CACHE"
          test -w "$HOME"
      - name: Report unselected homepage acceptance
        if: ${{ !(needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true') }}
        run: echo "Homepage acceptance is not selected for this change."
      - name: Checkout
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: npm ci
      - name: Verify pinned browser image and unprivileged runtime
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: npm run check:homepage-runtime
      - name: Download candidate build
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Restore exact candidate static site
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: node scripts/pages-candidate.mjs restore
      - name: Verify mandatory homepage discovery and coverage
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        id: homepage_discovery
        run: npm run check:homepage-selection
      - name: Run Linux homepage functional acceptance
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run test:homepage-functional
      - name: Record controlled homepage performance diagnostics
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run test:homepage-performance
      - name: Record bounded Linux WebKit media divergence (not acceptance)
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run diagnose:homepage-linux-media
      - name: Confirm tested candidate bytes
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        env:
          CANDIDATE_REPORT: test-results/homepage-functional.json
        run: node scripts/pages-candidate.mjs proof
      - name: Upload tested candidate identity
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pages-proof-homepage-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-proofs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload short homepage evidence
        if: always() && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: homepage-acceptance-${{ github.sha }}
          path: |
            test-results/homepage-*.json
            test-results/homepage-discovery-*/
            test-results/homepage-webkit/
            test-results/homepage-functional/
            test-results/homepage-linux-diagnostic/
            test-results/homepage-linux-diagnostic.log
            test-results/homepage-performance/
            playwright-report/homepage-webkit/
            playwright-report/homepage-functional/
            playwright-report/homepage-performance/
          retention-days: 7
          if-no-files-found: warn

  browser-validation:
    needs: [release-compatibility, homepage-validation, homepage-webkit-media, worker-validation]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_BASE: ${{ needs.release-compatibility.outputs.candidate_base }}
      STATIC_TEST_ROOT: _site
    steps:
      - name: Report skipped browser tests
        if: needs.release-compatibility.outputs.homepage != 'true' && needs.release-compatibility.outputs.carousel != 'true' && needs.release-compatibility.outputs.assets != 'true' && needs.release-compatibility.outputs.auth != 'true'
        run: echo "Browser tests skipped because no frontend, homepage, auth, or admin files changed."
      - name: Checkout
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        run: npm ci
      - name: Install carousel browser matrix
        if: needs.release-compatibility.outputs.carousel == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Chromium for selected frontend tests
        if: needs.release-compatibility.outputs.admin_release != 'true' && needs.release-compatibility.outputs.carousel != 'true' && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true')
        run: npx playwright install --with-deps chromium
      - name: Install Admin acceptance browsers
        if: needs.release-compatibility.outputs.admin_release == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Download candidate build
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Restore exact candidate static site
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        run: node scripts/pages-candidate.mjs restore
      - name: Run selected Admin release acceptance
        if: needs.release-compatibility.outputs.admin_release == 'true'
        run: |
          rm -f test-results/admin-discovery.json test-results/candidate-admin-release.json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/admin-discovery.json npm run test:static -- --config playwright.admin-release.config.js --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-admin-release.json npm run test:static -- --config playwright.admin-release.config.js --reporter=list,json
      - name: Run full static browser regression
        if: needs.release-compatibility.outputs.full == 'true'
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-static.json npm run test:static -- --reporter=list,json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-carousel.json npm run test:homepage-carousel -- --reporter=list,json
      - name: Run selected homepage core tests
        if: needs.release-compatibility.outputs.homepage == 'true' && needs.release-compatibility.outputs.full != 'true'
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-homepage.json npm run test:homepage-core -- --reporter=list,json
      - name: Run selected homepage carousel tests
        if: needs.release-compatibility.outputs.carousel == 'true' && needs.release-compatibility.outputs.full != 'true'
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-carousel.json npm run test:homepage-carousel -- --reporter=list,json
      - name: Run selected Assets Manager tests
        if: needs.release-compatibility.outputs.assets == 'true' && needs.release-compatibility.outputs.full != 'true'
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-assets.json npm run test:assets-manager -- --reporter=list,json
      - name: Run selected auth and admin tests
        if: needs.release-compatibility.outputs.auth == 'true' && needs.release-compatibility.outputs.full != 'true' && needs.release-compatibility.outputs.admin_release != 'true'
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:auth -- --reporter=list,json
      - name: Confirm tested browser candidate bytes
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        run: node scripts/pages-candidate.mjs proof
      - name: Upload tested browser candidate identity
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pages-proof-browser-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-proofs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright report
        if: (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true') && failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-selected
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  reuse-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      artifact_ids: ${{ steps.source.outputs.artifact_ids }}
      candidate_base: ${{ steps.baseline.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve verified published Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_INPUT: ${{ github.event.inputs.release_plan_base_ref }}
        run: node scripts/pages-candidate.mjs baseline
      - name: Preflight acknowledged full release
        env:
          STATIC_DEPLOY_ACK: ${{ github.event.inputs.release_plan_dependency_acknowledgement }}
        run: node scripts/check-static-deploy-safety.mjs --base "$CANDIDATE_BASE" --head "$GITHUB_SHA" --event-name workflow_dispatch --acknowledgement "$STATIC_DEPLOY_ACK"
      - name: Verify exact completed source acceptance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ github.event.inputs.candidate_run_attempt }}
        run: node scripts/pages-candidate.mjs source

  # Deployment remains gated by the release checks and every selected suite.
  deploy:
    needs: [release-compatibility, worker-validation, browser-validation, homepage-validation, homepage-webkit-media, reuse-candidate]
    if: ${{ !cancelled() && ((needs.reuse-candidate.result == 'success' && github.event.inputs.candidate_run_id != '') || (!github.event.inputs.candidate_run_id && (github.event_name == 'workflow_dispatch' || (needs.release-compatibility.outputs.pages_allowed == 'true' && needs.release-compatibility.outputs.pages_required == 'true')) && needs.release-compatibility.result == 'success' && needs.worker-validation.result == 'success' && needs.browser-validation.result == 'success' && needs.homepage-validation.result == 'success' && needs.homepage-webkit-media.result == 'success')) }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    env:
      CANDIDATE_BASE: ${{ needs.reuse-candidate.outputs.candidate_base || needs.release-compatibility.outputs.candidate_base }}
      CANDIDATE_RUN: ${{ github.event.inputs.candidate_run_id || github.run_id }}
      CANDIDATE_ATTEMPT: ${{ github.event.inputs.candidate_run_id && github.event.inputs.candidate_run_attempt || github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check static deploy release-plan safety
        id: static_safety
        env:
          STATIC_DEPLOY_EVENT: ${{ github.event_name }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          STATIC_DEPLOY_BASE_REF: ${{ env.CANDIDATE_BASE }}
          STATIC_DEPLOY_HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run check:static-deploy-safety:github -- --base "${STATIC_DEPLOY_BASE_REF:-}" --head "${STATIC_DEPLOY_HEAD_REF:-}" --event-name "$STATIC_DEPLOY_EVENT" --acknowledgement "$STATIC_DEPLOY_ACK"
      - name: Report skipped static deploy
        if: steps.static_safety.outputs.static_deploy_skipped == 'true'
        run: |
          echo "Static deploy skipped because release plan requires non-static deploy steps first."
          echo "Workers, D1 migrations, and processor services are not deployed by the GitHub Pages workflow."
      - name: Report validation-only run
        if: steps.static_safety.outputs.static_deploy_skipped != 'true' && steps.static_safety.outputs.static_deploy_required != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Static deploy skipped because no GitHub Pages source changed."
      - name: Setup Pages
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6
      - name: Validate JS import paths
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          errors=0
          grep -rn "from ['\"]\.\.*/.*['\"]" --include="*.js" --include="*.html" --exclude-dir=node_modules --exclude-dir=workers --exclude-dir=.wrangler . | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            # Extract the path between quotes after "from"
            import_path=$(echo "$line" | sed "s/.*from ['\"]//;s/['\"].*//" )
            # Strip query params (?v=...)
            clean_path=$(echo "$import_path" | sed 's/?.*//')
            # Resolve relative to the importing file's directory
            dir=$(dirname "$file")
            resolved=$(cd "$dir" && realpath -m "$clean_path" 2>/dev/null || echo "$dir/$clean_path")
            if [ ! -f "$resolved" ]; then
              echo "ERROR: Broken import in $file"
              echo "  import '$import_path' -> $resolved (not found)"
              echo "FAIL" >> /tmp/import_errors
            fi
          done
          if [ -f /tmp/import_errors ]; then
            count=$(wc -l < /tmp/import_errors)
            rm /tmp/import_errors
            echo ""
            echo "FAILED: $count broken import path(s) found"
            exit 1
          fi
          echo "All JS import paths validated successfully"
      - name: Check target="_blank" links have rel="noopener"
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          violations=$(grep -rn 'target="_blank"' --include="*.html" --include="*.js" --exclude-dir=node_modules --exclude-dir=workers --exclude-dir=_site --exclude-dir=.wrangler --exclude="*.min.js" . | grep -v 'noopener' || true)
          if [ -n "$violations" ]; then
            echo "ERROR: Found target=\"_blank\" without rel=\"noopener noreferrer\":"
            echo "$violations"
            echo ""
            echo "FAILED: Add rel=\"noopener noreferrer\" to all target=\"_blank\" links"
            exit 1
          fi
          echo "All target=\"_blank\" links include rel=\"noopener\" — OK"
      - name: Validate local CSS/JS references
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          # Check that CSS stylesheet and JS script references point to existing files
          # (Complements the JS import path validator above)
          grep -rn 'href="[^"]*\.css' --include="*.html" --exclude-dir=node_modules --exclude-dir=workers --exclude-dir=_site --exclude-dir=.wrangler . | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            echo "$line" | grep -oE 'href="[^"]*\.css[^"]*"' | sed 's/href="//;s/"//' | while IFS= read -r ref; do
              case "$ref" in http://*|https://*|//*) continue ;; esac
              [ -z "$ref" ] && continue
              clean=$(echo "$ref" | sed 's/[?#].*//')
              dir=$(dirname "$file")
              resolved=$(cd "$dir" && realpath -m "$clean" 2>/dev/null || echo "$dir/$clean")
              if [ ! -f "$resolved" ]; then
                echo "ERROR: Missing CSS in $file"
                echo "  href='$ref' -> $resolved (not found)"
                echo "FAIL" >> /tmp/asset_errors
              fi
            done
          done
          grep -rn 'src="[^"]*\.js' --include="*.html" --exclude-dir=node_modules --exclude-dir=workers --exclude-dir=_site --exclude-dir=.wrangler . | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            echo "$line" | grep -oE 'src="[^"]*\.js[^"]*"' | sed 's/src="//;s/"//' | while IFS= read -r ref; do
              case "$ref" in http://*|https://*|//*) continue ;; esac
              [ -z "$ref" ] && continue
              clean=$(echo "$ref" | sed 's/[?#].*//')
              dir=$(dirname "$file")
              resolved=$(cd "$dir" && realpath -m "$clean" 2>/dev/null || echo "$dir/$clean")
              if [ ! -f "$resolved" ]; then
                echo "ERROR: Missing JS in $file"
                echo "  src='$ref' -> $resolved (not found)"
                echo "FAIL" >> /tmp/asset_errors
              fi
            done
          done
          if [ -f /tmp/asset_errors ]; then
            count=$(wc -l < /tmp/asset_errors)
            rm /tmp/asset_errors
            echo ""
            echo "FAILED: $count broken CSS/JS reference(s) found"
            exit 1
          fi
          echo "All local CSS/JS references validated successfully"
      - name: Validate page metadata
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          errors=0
          for f in index.html; do
            [ ! -f "$f" ] && continue
            if ! grep -q '<meta name="description"' "$f"; then
              echo "ERROR: Missing meta description in $f"
              errors=$((errors + 1))
            fi
            if ! grep -q '<link rel="canonical"' "$f"; then
              echo "ERROR: Missing canonical link in $f"
              errors=$((errors + 1))
            fi
            if ! grep -q 'og:title' "$f"; then
              echo "ERROR: Missing og:title in $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors metadata error(s) found"
            exit 1
          fi
          echo "Page metadata validated successfully"
      - name: Download selected completed candidate
        if: success() && needs.reuse-candidate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.reuse-candidate.outputs.artifact_ids }}
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          repository: bitbiai/Bitbi
          merge-multiple: true
          path: candidate
          digest-mismatch: error
      - name: Download this run's tested candidate
        if: success() && !github.event.inputs.candidate_run_id
        uses: actions/download-artifact@v8
        with:
          pattern: pages-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: candidate
          digest-mismatch: error
      - name: Prepare deployment
        id: static_build
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        run: node scripts/pages-candidate.mjs publish
      - name: Upload artifact
        id: pages_artifact
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Refuse superseded or newly failed publication
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch') && steps.static_build.outcome == 'success' && steps.pages_artifact.outcome == 'success'
        env:
          CANDIDATE_ARTIFACT_IDS: ${{ needs.reuse-candidate.outputs.artifact_ids }}
          REUSED_CANDIDATE: ${{ github.event.inputs.candidate_run_id }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/check-static-deploy-safety.mjs --base "$CANDIDATE_BASE" --head "$GITHUB_SHA" --event-name "$GITHUB_EVENT_NAME" --acknowledgement "$STATIC_DEPLOY_ACK"
          if [ -n "$REUSED_CANDIDATE" ]; then
            node scripts/pages-candidate.mjs source
          else
            node scripts/pages-candidate.mjs current
          fi
      - name: Deploy to GitHub Pages
        if: success() && steps.static_safety.outcome == 'success' && steps.static_safety.outputs.static_deploy_allowed == 'true' && steps.static_safety.outputs.static_deploy_skipped == 'false' && (steps.static_safety.outputs.static_deploy_required == 'true' || github.event_name == 'workflow_dispatch') && steps.static_build.outcome == 'success' && steps.pages_artifact.outcome == 'success'
        id: deployment
        # The official action checks this run's created deployment; its failure remains fatal.
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 1
