# Portable release command contract. Executed by scripts/local-release.mjs.
# Scheduled Full and Memvid remain independent workflow owners.
# Actions-shaped preparation/transport declarations document the required tools;
# the local adapter validates them and supplies pinned caches, never runner identity.
version: 1
jobs:
  release-compatibility:
    if: ${{ !github.event.inputs.candidate_run_id && !github.event.inputs.frontend_recovery_receipt }}
    runs-on: ubuntu-latest
    outputs:
      browser_repair: ${{ steps.selection.outputs.browser_repair }}
      repair_source_sha: ${{ steps.selection.outputs.repair_source_sha }}
      repair_source_run: ${{ steps.selection.outputs.repair_source_run }}
      repair_source_attempt: ${{ steps.selection.outputs.repair_source_attempt }}
      hosting_provider: ${{ steps.hosting.outputs.provider }}
      candidate_base: ${{ steps.baseline.outputs.base }}
      pages_allowed: ${{ steps.release_preflight.outputs.static_deploy_allowed }}
      backend_continuation: ${{ steps.release_preflight.outputs.backend_continuation }}
      pages_required: ${{ steps.release_preflight.outputs.static_deploy_required }}
      docs_only: ${{ steps.selection.outputs.docs_only }}
      homepage: ${{ steps.selection.outputs.homepage }}
      carousel: ${{ steps.selection.outputs.carousel }}
      assets: ${{ steps.selection.outputs.assets }}
      workers: ${{ steps.selection.outputs.workers }}
      auth: ${{ steps.selection.outputs.auth }}
      admin_release: ${{ steps.selection.outputs.admin_release }}
      member_assets: ${{ steps.selection.outputs.member_assets }}
      public_media: ${{ steps.selection.outputs.public_media }}
      model_status: ${{ steps.selection.outputs.model_status }}
      model_areas: ${{ steps.selection.outputs.model_areas }}
      model_pricing: ${{ steps.selection.outputs.model_pricing }}
      image_models: ${{ steps.selection.outputs.image_models }}
      appearance: ${{ steps.selection.outputs.appearance }}
      canvas_text: ${{ steps.selection.outputs.canvas_text }}
      canvas_completion: ${{ steps.selection.outputs.canvas_completion }}
      canvas_audio: ${{ steps.selection.outputs.canvas_audio }}
      canvas_transitions: ${{ steps.selection.outputs.canvas_transitions }}
      canvas_export_repair: ${{ steps.selection.outputs.canvas_export_repair }}
      canvas_audio_fit: ${{ steps.selection.outputs.canvas_audio_fit }}
      canvas_examples: ${{ steps.selection.outputs.canvas_examples }}
      canvas_inspector: ${{ steps.selection.outputs.canvas_inspector }}
      media_lifecycle: ${{ steps.selection.outputs.media_lifecycle }}
      workspace_help: ${{ steps.selection.outputs.workspace_help }}
      dependencies: ${{ steps.selection.outputs.dependencies }}
      worker_dependencies: ${{ steps.selection.outputs.worker_dependencies }}
      static: ${{ steps.selection.outputs.static }}
      full: ${{ steps.selection.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Read hosting target
        id: hosting
        run: node scripts/frontend-release.mjs target
      - name: Resolve verified published Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_FRONTEND_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_FRONTEND_ACCOUNT_ID }}
          RELEASE_BASE_INPUT: ${{ github.event.inputs.release_plan_base_ref }}
        run: node scripts/pages-candidate.mjs baseline
      - name: Install dependencies
        run: npm ci
      - name: Preflight complete static release plan
        id: release_preflight
        env:
          STATIC_DEPLOY_EVENT: ${{ github.event_name }}
          STATIC_DEPLOY_ACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_plan_dependency_acknowledgement || '' }}
          STATIC_DEPLOY_BASE_REF: ${{ env.CANDIDATE_BASE }}
          STATIC_DEPLOY_HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run check:static-deploy-safety:github -- --backend-preflight --base "${STATIC_DEPLOY_BASE_REF:-}" --head "${STATIC_DEPLOY_HEAD_REF:-}" --event-name "$STATIC_DEPLOY_EVENT" --acknowledgement "$STATIC_DEPLOY_ACK"
      - name: Select tests from changed files
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          # Failed/skipped pushes remain in the unpublished range.
          CI_BASE_REF: ${{ env.CANDIDATE_BASE }}
          CI_HEAD_REF: ${{ github.sha }}
        run: node scripts/select-ci-tests.mjs --base "$CI_BASE_REF" --head "$CI_HEAD_REF" --github-output
      - name: Audit root dependencies
        if: steps.selection.outputs.dependencies == 'true'
        run: npm audit --audit-level=low
      - name: Validate worker package dependencies
        if: steps.selection.outputs.worker_dependencies == 'true'
        run: npm run check:worker-dependency-audits
      - name: Check toolchain pinning
        run: npm run check:toolchain
      - name: Run quality gate tests
        run: npm run test:quality-gates
      - name: Check committed secrets
        run: npm run check:secrets
      - name: Check DOM sink baseline
        run: npm run check:dom-sinks
      - name: Check auth route policy coverage
        run: npm run check:route-policies
      - name: Test operational readiness checks
        run: npm run test:operational-readiness
      - name: Check operational readiness docs
        run: npm run check:operational-readiness
      - name: Run live health check in skipped mode
        run: npm run check:live-health
      - name: Run live security header check in skipped mode
        run: npm run check:live-security-headers
      - name: Test live runtime canary skipped/safe mode
        run: npm run test:live-canary
      - name: Test release cutover evidence generator
        run: npm run test:release-cutover-evidence
      - name: Check targeted JavaScript syntax
        run: npm run check:js
      - name: Run release compatibility tests
        run: npm run test:release-compat
      - name: Install pinned frontend runtime tooling
        if: steps.selection.outputs.worker_dependencies != 'true'
        run: npm --prefix workers/contact ci
      - name: Run release planner tests
        run: npm run test:release-plan
      - name: Run static deploy safety tests
        run: npm run test:static-deploy-safety
      - name: Run CI test selection fixtures
        run: npm run test:ci-selection
      - name: Test local release evidence and orchestration
        run: npm run test:local-release
      - name: Test mandatory homepage selection
        run: npm run test:homepage-selection
      - name: Run Cloudflare deploy prerequisite tests
        run: npm run test:cloudflare-prereqs
      - name: Run Cloudflare resource model tests
        run: npm run test:cloudflare-resource-model
      - name: Run readiness dossier tests
        run: npm run test:readiness-dossier
      - name: Run rollback drill tests
        run: npm run test:rollback-drill
      - name: Run Release Candidate manifest tests
        run: npm run test:release-rc
      - name: Run Release Candidate matrix tests
        run: npm run test:rc-check
      - name: Check Worker body parser guardrails
        run: npm run check:worker-body-parsers
      - name: Check admin activity query shape
        run: npm run check:admin-activity-query-shape
      - name: Check data lifecycle guardrails
        run: npm run check:data-lifecycle
      - name: Run doc currentness tests
        run: npm run test:doc-currentness
      - name: Check documentation currentness
        run: npm run check:doc-currentness
      - name: Run asset version tests
        run: npm run test:asset-version
      - name: Validate release compatibility
        run: npm run validate:release
      - name: Validate Cloudflare deploy prerequisites
        run: npm run validate:cloudflare-prereqs
      - name: Validate asset version sources
        run: npm run validate:asset-version

      - name: Record candidate build
        if: env.REPAIR_SOURCE_SHA == ''
        env:
          CANDIDATE_FULL: ${{ steps.selection.outputs.full }}
        run: |
          npm run build:static
          node scripts/pages-candidate.mjs record
      - name: Validate static website references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${REPAIR_SOURCE_SHA:-}" ]; then
            export CANDIDATE_RUN="$REPAIR_SOURCE_RUN" CANDIDATE_ATTEMPT="$REPAIR_SOURCE_ATTEMPT"
            node scripts/frontend-release.mjs production-source
          fi
          node scripts/validate-site-references.mjs --root . --source
          node scripts/validate-site-references.mjs --root candidate/site
      - name: Check frontend hosting package
        run: |
          if [ -n "$REPAIR_SOURCE_SHA" ]; then
            npm run test:frontend-hosting -- --unit
          else
            npm run test:frontend-hosting
          fi
      - name: Upload immutable candidate build
        if: env.REPAIR_SOURCE_SHA == ''
        uses: actions/upload-artifact@v6
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Validate JS import paths
        run: |
          errors=0
          grep -rn "from ['\"]\.\.*/.*['\"]" --include="*.js" --include="*.html" --exclude-dir=node_modules --exclude-dir=workers --exclude-dir=.wrangler . | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            # Extract the path between quotes after "from"
            import_path=$(echo "$line" | sed "s/.*from ['\"]//;s/['\"].*//" )
            # Strip query params (?v=...)
            clean_path=$(echo "$import_path" | sed 's/?.*//')
            # Resolve relative to the importing file's directory
            dir=$(dirname "$file")
            resolved=$(cd "$dir" && realpath -m "$clean_path" 2>/dev/null || echo "$dir/$clean_path")
            if [ ! -f "$resolved" ]; then
              echo "ERROR: Broken import in $file"
              echo "  import '$import_path' -> $resolved (not found)"
              echo "FAIL" >> /tmp/import_errors
            fi
          done
          if [ -f /tmp/import_errors ]; then
            count=$(wc -l < /tmp/import_errors)
            rm /tmp/import_errors
            echo ""
            echo "FAILED: $count broken import path(s) found"
            exit 1
          fi
          echo "All JS import paths validated successfully"
      - name: Check target="_blank" links have rel="noopener"
        run: |
          violations=$(grep -rn 'target="_blank"' --include="*.html" --include="*.js" --exclude-dir=node_modules --exclude-dir=workers --exclude-dir=_site --exclude-dir=.wrangler --exclude="*.min.js" . | grep -v 'noopener' || true)
          if [ -n "$violations" ]; then
            echo "ERROR: Found target=\"_blank\" without rel=\"noopener noreferrer\":"
            echo "$violations"
            echo ""
            echo "FAILED: Add rel=\"noopener noreferrer\" to all target=\"_blank\" links"
            exit 1
          fi
          echo "All target=\"_blank\" links include rel=\"noopener\" — OK"
      - name: Validate page metadata
        run: |
          errors=0
          for f in index.html; do
            [ ! -f "$f" ] && continue
            if ! grep -q '<meta name="description"' "$f"; then
              echo "ERROR: Missing meta description in $f"
              errors=$((errors + 1))
            fi
            if ! grep -q '<link rel="canonical"' "$f"; then
              echo "ERROR: Missing canonical link in $f"
              errors=$((errors + 1))
            fi
            if ! grep -q 'og:title' "$f"; then
              echo "ERROR: Missing og:title in $f"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "FAILED: $errors metadata error(s) found"
            exit 1
          fi
          echo "Page metadata validated successfully"
  worker-validation:
    needs: release-compatibility
    if: ${{ needs.release-compatibility.outputs.workers == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Distinct reviewed local origin; Full retains its unchanged hosted guard.
      BITBI_LOCAL_RELEASE_CONTAINER: '1'
    steps:
      - name: Checkout
        if: needs.release-compatibility.outputs.workers == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.workers == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.release-compatibility.outputs.workers == 'true'
        run: npm ci
      - name: Install pinned Auth target-runtime test dependencies
        if: needs.release-compatibility.outputs.workers == 'true'
        run: npm --prefix workers/auth ci
      - name: Install Worker media test tools
        if: needs.release-compatibility.outputs.workers == 'true' && needs.release-compatibility.outputs.appearance != 'true' && needs.release-compatibility.outputs.model_pricing != 'true' && needs.release-compatibility.outputs.model_status != 'true' && needs.release-compatibility.outputs.member_assets != 'true' && needs.release-compatibility.outputs.canvas_text != 'true'
        run: bash scripts/setup-media-tools.sh
      - name: Verify native Linux isolation before Worker tests
        if: needs.release-compatibility.outputs.workers == 'true' && needs.release-compatibility.outputs.media_lifecycle != 'true'
        env:
          Q2_RUNTIME_ARTIFACTS: ${{ runner.temp }}/q2-runtime-evidence
        run: node scripts/test-q2-runtime.mjs --preflight
      - name: Run worker route tests
        if: needs.release-compatibility.outputs.workers == 'true' && needs.release-compatibility.outputs.media_lifecycle != 'true'
        env:
          Q2_RUNTIME_ARTIFACTS: ${{ runner.temp }}/q2-runtime-evidence
          CI_IMAGE_MODELS: ${{ needs.release-compatibility.outputs.image_models }}
          CI_APPEARANCE: ${{ needs.release-compatibility.outputs.appearance }}
          CI_MEMBER_ASSETS: ${{ needs.release-compatibility.outputs.member_assets }}
        run: |
          if [ "${{ needs.release-compatibility.outputs.appearance }}" = 'true' ] && [ "${{ needs.release-compatibility.outputs.model_pricing }}" != 'true' ]; then
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            npx playwright test -c playwright.workers.config.js tests/appearance.spec.js --retries=0 &&
            node scripts/test-q2-runtime.mjs --suite appearance || exit $?
            if [ "$CI_MEMBER_ASSETS" = 'true' ]; then
              npx playwright test -c playwright.workers.config.js tests/workers.spec.js tests/admin-ai-save-operations.spec.js --grep 'image|video|music|text asset|text-asset|durable member|asset naming' --retries=0 &&
              Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/member-generation" node scripts/test-q2-runtime.mjs --suite member-generation || exit $?
            fi
          elif [ "${{ needs.release-compatibility.outputs.model_pricing }}" = 'true' ]; then
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            npx playwright test -c playwright.workers.config.js tests/model-pricing.spec.js --retries=0 &&
            npx playwright test -c playwright.workers.config.js tests/workers.spec.js --grep 'Canvas Grok one-shot|Canvas Fable 5 run charges|admin Canvas resolves active organization|Canvas admin billing denies|member user-scoped image generation|member personal image gateway|central AI model pricing dispatch|member PixVerse V6 generation|member video gateway rejects|member HappyHorse T2V generation|member Seedance 2.0 Fast generation|member Grok Imagine Video rejects|member music generation charges|member music generation blocks|member music provider and storage failures|member music billing finalization|org owner, admin, and member roles can generate|insufficient org credits and provider failures|Phase 2-D active reservations|Phase 2-H text generation|charged BFL admin image tests|admin text durable idempotency|admin text duplicate in-progress|admin text, embeddings, compare, and live-agent|admin text and embeddings caller-policy|queues priced Seedance|queues Grok Imagine Video|runtime admin video job budget switch' --retries=0 &&
            node scripts/test-q2-runtime.mjs --suite model-pricing || exit $?
            if [ "$CI_IMAGE_MODELS" = 'true' ]; then
              mkdir -p "$Q2_RUNTIME_ARTIFACTS/canvas"
              npx playwright test -c playwright.workers.config.js tests/q2-gpt-image-25.spec.js --retries=0 &&
              npx playwright test -c playwright.workers.config.js tests/workers.spec.js --grep 'GPT Image 2|GPT-Image-2|gpt-image-2' --retries=0 &&
              Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/canvas" node scripts/test-q2-runtime.mjs --suite canvas || exit $?
            fi
            if [ "$CI_APPEARANCE" = 'true' ]; then
              mkdir -p "$Q2_RUNTIME_ARTIFACTS/appearance"
              npx playwright test -c playwright.workers.config.js tests/appearance.spec.js --retries=0 &&
              Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/appearance" node scripts/test-q2-runtime.mjs --suite appearance || exit $?
            fi
          elif [ "${{ needs.release-compatibility.outputs.canvas_transitions }}" = 'true' ]; then
            node --test tests/canvas-workspace-transitions.test.mjs tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            node scripts/test-q2-runtime.mjs --suite canvas-transitions
          elif [ "${{ needs.release-compatibility.outputs.canvas_audio_fit }}" = 'true' ]; then
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            node scripts/test-q2-runtime.mjs --suite canvas-audio-fit
          elif [ "${{ needs.release-compatibility.outputs.canvas_audio }}" = 'true' ]; then
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            npx playwright test -c playwright.workers.config.js tests/q2-mock-lifecycle.spec.js --grep 'Canvas audio' --retries=0 &&
            node scripts/test-q2-runtime.mjs --suite canvas-audio
          elif [ "${{ needs.release-compatibility.outputs.canvas_completion }}" = 'true' ]; then
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            node scripts/test-q2-runtime.mjs --suite canvas-completion
          elif [ "${{ needs.release-compatibility.outputs.canvas_text }}" = 'true' ]; then
            npm run check:ai-cost-policy && npm run test:ai-cost-policy && npm run test:ai-cost-operations &&
            node --test tests/website-assistant-knowledge.test.mjs &&
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-music-worker.json npx playwright test -c playwright.workers.config.js tests/q2-member-music.spec.js tests/q2-gemini-omni.spec.js tests/q2-seedance-25.spec.js tests/model-pricing.spec.js tests/q2-mock-lifecycle.spec.js tests/q4-stream-receipts.spec.js tests/q4-stream-selection.spec.js tests/q4-video-jobs.spec.js tests/rel01/routes/workers.spec.js tests/release-transition/workers.spec.js --retries=0 --reporter=list,json --output=test-results/canvas-music-worker-artifacts &&
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-music-adapter.json npx playwright test -c playwright.workers.config.js tests/workers.spec.js --grep 'ElevenLabs|AI worker binds Music|Phase 2-E admin usage|GET /api/admin/ai/models returns|GET /api/admin/ai/budget-evidence returns|AI generate: failed model|publish-trigger dispatch' --retries=0 --reporter=list,json --output=test-results/canvas-music-adapter-artifacts &&
            npx playwright test -c playwright.workers.config.js tests/workers.spec.js --grep 'durable member generation: flux-|default FLUX Schnell|Canvas|member text|text generation|text schema|AI Lab text|Grok Imagine Image|Grok Imagine Video|invoke-video payload builder serializes Grok|AI image pricing|AI generate: member|AI generate-music|AI assets|AI folders|readiness/status|homepage hero|homepage Hero|Memvid Stream|Memvid queues' --retries=0 &&
            npx playwright test -c playwright.workers.config.js tests/grok-chat-workers.spec.js --retries=0 &&
            npx playwright test -c playwright.workers.config.js tests/fable-chat-workers.spec.js --grep 'registry|model|reasoning|budget|idempot|replay' --retries=0 &&
            npx playwright test -c playwright.workers.config.js tests/q2-lifecycle.spec.js --retries=0 &&
            node scripts/test-q2-runtime.mjs --suite canvas &&
            Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/model-pricing" node scripts/test-q2-runtime.mjs --suite model-pricing &&
            Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/member-generation" node scripts/test-q2-runtime.mjs --suite member-generation &&
            Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/q4-stream" node scripts/test-q2-runtime.mjs --suite q4-stream &&
            Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/appearance" node scripts/test-q2-runtime.mjs --suite appearance &&
            Q2_RUNTIME_ARTIFACTS="$Q2_RUNTIME_ARTIFACTS/model-status" node scripts/test-q2-runtime.mjs --suite model-status
          elif [ "${{ needs.release-compatibility.outputs.model_status }}" = 'true' ]; then
            if [ "${{ needs.release-compatibility.outputs.model_areas }}" = 'true' ]; then
              node --test tests/website-assistant-route.test.mjs tests/website-assistant-control.test.mjs tests/website-assistant-provider.test.mjs &&
              npx playwright test -c playwright.workers.config.js tests/workers.spec.js --grep 'Canvas|AI generate: member|Phase 2-E admin usage|member text|AI generate-music' --retries=0
            fi &&
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            npx playwright test -c playwright.workers.config.js tests/admin-model-status.spec.js --retries=0 &&
            node scripts/test-q2-runtime.mjs --suite model-status
          elif [ "${{ needs.release-compatibility.outputs.member_assets }}" = 'true' ]; then
            node --test tests/q2-recovery-staging.test.mjs scripts/test-q2-runtime-launcher.mjs &&
            npx playwright test -c playwright.workers.config.js tests/workers.spec.js tests/admin-ai-save-operations.spec.js --grep 'image|video|music|text asset|text-asset|durable member|asset naming' --retries=0 &&
            node scripts/test-q2-runtime.mjs --suite member-generation
          else
            npm run test:workers
          fi
      - name: Build and test private media Linux image
        id: media_image
        env:
          CANDIDATE_BASE: ${{ needs.release-compatibility.outputs.candidate_base }}
        run: node scripts/private-media-image.mjs --if-needed
      - name: Run private media lifecycle tests
        if: needs.release-compatibility.outputs.media_lifecycle == 'true' || steps.media_image.outputs.required == 'true'
        run: |
          npm --prefix workers/media ls --depth=0
          node scripts/test-private-media-lifecycle.mjs
      - name: Verify repaired native media smoke
        if: needs.release-compatibility.outputs.repair_source_sha != ''
        env:
          Q2_RUNTIME_ARTIFACTS: ${{ runner.temp }}/q2-runtime-evidence
        run: node scripts/test-q2-runtime.mjs --suite canvas
      - name: Preserve tested private media image
        if: steps.media_image.outputs.required == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: private-media-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/private-media-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload native Linux acceptance evidence
        if: always() && needs.release-compatibility.outputs.workers == 'true' && (needs.release-compatibility.outputs.media_lifecycle != 'true' || needs.release-compatibility.outputs.repair_source_sha != '')
        uses: actions/upload-artifact@v6
        with:
          name: q2-linux-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/q2-runtime-evidence/
          retention-days: 7
          if-no-files-found: error

  # Short homepage feedback runs independently of the long browser regression.
  homepage-validation:
    needs: release-compatibility
    if: ${{ needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Browser/dependency bytes match package-lock; no per-run apt upgrade.
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001:1001 --init --ipc=host --cap-drop=ALL --security-opt=no-new-privileges
    env:
      CANDIDATE_BASE: ${{ needs.release-compatibility.outputs.candidate_base }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The local tooling layer pins Node 22; writable paths and an empty
      # capability set are verified before repository code executes.
      npm_config_cache: /tmp/bitbi-homepage-npm
    steps:
      - name: Prepare unprivileged tool paths
        run: |
          set -eu
          test "$(id -u)" = 1001
          test "$(id -g)" = 1001
          mkdir -p /tmp/bitbi-homepage-npm
          test -n "${RUNNER_TOOL_CACHE:-}"
          test -w "$RUNNER_TOOL_CACHE"
          test -w "$HOME"
      - name: Checkout
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: npm ci
      - name: Verify pinned browser image and unprivileged runtime
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: npm run check:homepage-runtime
      - name: Download candidate build
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Restore exact candidate static site
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        run: node scripts/pages-candidate.mjs restore
      - name: Verify mandatory homepage discovery and coverage
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        id: homepage_discovery
        run: npm run check:homepage-selection
      - name: Run Linux homepage functional acceptance
        if: ${{ success() && steps.homepage_discovery.outcome == 'success' }}
        run: npm run test:homepage-functional
      - name: Record controlled homepage performance diagnostics
        if: ${{ success() && needs.release-compatibility.outputs.carousel == 'true' && steps.homepage_discovery.outcome == 'success' }}
        run: npm run test:homepage-performance
      - name: Confirm tested candidate bytes
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        env:
          CANDIDATE_REPORT: test-results/homepage-functional.json
        run: node scripts/pages-candidate.mjs proof
      - name: Upload tested candidate identity
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pages-proof-homepage-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-proofs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload short homepage evidence
        if: always() && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: homepage-acceptance-${{ github.sha }}
          path: |
            test-results/homepage-*.json
            test-results/homepage-discovery-*/
            test-results/homepage-functional/
            test-results/homepage-performance/
            playwright-report/homepage-functional/
            playwright-report/homepage-performance/
          retention-days: 7
          if-no-files-found: warn

  browser-validation:
    needs: [release-compatibility, homepage-validation, worker-validation]
    if: ${{ !cancelled() && needs.release-compatibility.result == 'success' && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true') && (needs.release-compatibility.outputs.workers == 'false' || (needs.release-compatibility.outputs.workers == 'true' && needs.worker-validation.result == 'success')) && ((needs.release-compatibility.outputs.homepage == 'false' && needs.release-compatibility.outputs.carousel == 'false') || ((needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true') && needs.homepage-validation.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      CANDIDATE_BASE: ${{ needs.release-compatibility.outputs.candidate_base }}
      STATIC_TEST_ROOT: _site
      REPAIR_SOURCE_SHA: ${{ needs.release-compatibility.outputs.repair_source_sha }}
      REPAIR_SOURCE_RUN: ${{ needs.release-compatibility.outputs.repair_source_run }}
      REPAIR_SOURCE_ATTEMPT: ${{ needs.release-compatibility.outputs.repair_source_attempt }}
      CANDIDATE_RUN: ${{ needs.release-compatibility.outputs.repair_source_run || github.run_id }}
      CANDIDATE_ATTEMPT: ${{ needs.release-compatibility.outputs.repair_source_attempt || github.run_attempt }}
    steps:
      - name: Checkout
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        run: npm ci
      - name: Install Canvas browser media tools
        if: needs.release-compatibility.outputs.canvas_completion != 'true' && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true')
        run: bash scripts/setup-media-tools.sh
      - name: Install carousel browser matrix
        if: needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.browser_repair == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install browsers for selected frontend tests
        if: needs.release-compatibility.outputs.browser_repair != 'true' && needs.release-compatibility.outputs.model_status != 'true' && needs.release-compatibility.outputs.workspace_help != 'true' && needs.release-compatibility.outputs.public_media != 'true' && needs.release-compatibility.outputs.assets != 'true' && needs.release-compatibility.outputs.admin_release != 'true' && needs.release-compatibility.outputs.carousel != 'true' && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true')
        run: |
          if [ "${{ needs.release-compatibility.outputs.homepage }}" = 'true' ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Install Admin acceptance browsers
        if: needs.release-compatibility.outputs.model_status == 'true' || needs.release-compatibility.outputs.admin_release == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.public_media == 'true' || needs.release-compatibility.outputs.workspace_help == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Download candidate build
        if: needs.release-compatibility.outputs.browser_repair != 'true' && (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true')
        uses: actions/download-artifact@v8
        with:
          name: pages-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
          digest-mismatch: error
      - name: Restore unchanged browser repair candidate
        if: needs.release-compatibility.outputs.browser_repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/frontend-release.mjs production-source
      - name: Restore exact candidate static site
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        run: |
          node scripts/pages-candidate.mjs restore
          rm -f test-results/candidate-*.json test-results/admin-discovery.json candidate-proofs/proof-browser-validation.json
      - name: Run selected Admin release acceptance
        if: needs.release-compatibility.outputs.admin_release == 'true'
        run: |
          rm -f test-results/admin-discovery.json test-results/candidate-admin-release.json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/admin-discovery.json npm run test:static -- --config playwright.admin-release.config.js --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-admin-release.json npm run test:static -- --config playwright.admin-release.config.js --reporter=list,json
      - name: Run repaired browser acceptance
        if: needs.release-compatibility.outputs.browser_repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pages-candidate.mjs repair-browser
      - name: Run full static browser regression
        if: needs.release-compatibility.outputs.full == 'true'
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-static.json npm run test:static -- --output=test-results/browser-artifacts --reporter=list,json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-carousel.json npm run test:homepage-carousel -- --reporter=list,json
      - name: Run selected homepage core tests
        if: needs.release-compatibility.outputs.homepage == 'true' && needs.release-compatibility.outputs.full != 'true'
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-homepage.json npm run test:homepage-core -- --output=test-results/browser-artifacts --reporter=list,json
      - name: Run selected homepage carousel tests
        if: needs.release-compatibility.outputs.carousel == 'true' && needs.release-compatibility.outputs.full != 'true'
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-carousel.json npm run test:homepage-carousel -- --reporter=list,json
      - name: Run selected Assets Manager tests
        if: needs.release-compatibility.outputs.assets == 'true' && needs.release-compatibility.outputs.full != 'true'
        run: |
          rm -f test-results/assets-discovery.json test-results/candidate-assets.json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/assets-discovery.json npm run test:static -- --config playwright.assets.config.js --list --reporter=json
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-assets.json npm run test:static -- --config playwright.assets.config.js --reporter=list,json
      - name: Run selected auth and admin tests
        if: needs.release-compatibility.outputs.browser_repair != 'true' && needs.release-compatibility.outputs.auth == 'true' && needs.release-compatibility.outputs.full != 'true' && needs.release-compatibility.outputs.admin_release != 'true'
        env:
          CI_IMAGE_MODELS: ${{ needs.release-compatibility.outputs.image_models }}
          CI_APPEARANCE: ${{ needs.release-compatibility.outputs.appearance }}
        run: |
          if [ "${{ needs.release-compatibility.outputs.appearance }}" = 'true' ] && [ "${{ needs.release-compatibility.outputs.model_pricing }}" != 'true' ]; then
            rm -f test-results/appearance-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/appearance-discovery.json npm run test:static -- tests/oma2-q3-appearance.spec.js tests/auth-admin.spec.js --project=chromium --project=webkit-appearance --grep 'oma2-q3-appearance\.spec\.js|cold workspace exposes grouped tasks' --workers=1 --retries=0 --output=test-results/appearance-artifacts --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/oma2-q3-appearance.spec.js tests/auth-admin.spec.js --project=chromium --project=webkit-appearance --grep 'oma2-q3-appearance\.spec\.js|cold workspace exposes grouped tasks' --workers=1 --retries=0 --output=test-results/appearance-artifacts --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.model_pricing }}" = 'true' ]; then
            rm -f test-results/model-pricing-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/model-pricing-discovery.json npm run test:static -- --config playwright.model-pricing.config.js --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- --config playwright.model-pricing.config.js --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_examples }}" = 'true' ]; then
            node --test tests/canvas-transition-examples.test.mjs
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas transition examples' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas transition examples' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_export_repair }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas workspace transitions .*: transitions|Canvas export lifecycle' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas workspace transitions .*: transitions|Canvas export lifecycle' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_transitions }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas workspace transitions' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas workspace transitions' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_inspector }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas Inspector' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas Inspector' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_audio_fit }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas audio fit' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas audio fit' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_audio }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js tests/oma2-q1-canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas|P13|@canvas-model-ui' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js tests/oma2-q1-canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas|P13|@canvas-model-ui' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_completion }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas completion metadata' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js --project=chromium --project=webkit-canvas --grep 'Canvas completion metadata' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.canvas_text }}" = 'true' ]; then
            rm -f test-results/canvas-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/canvas-discovery.json npm run test:static -- tests/canvas.spec.js tests/oma2-q1-canvas.spec.js tests/auth-admin.spec.js tests/smoke.spec.js tests/oma2-q1-member.spec.js tests/oma2-q3-model-pricing.spec.js --project=chromium --project=webkit-canvas --project=webkit-pricing --grep 'Canvas|P13|@canvas-model-ui' --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- tests/canvas.spec.js tests/oma2-q1-canvas.spec.js tests/auth-admin.spec.js tests/smoke.spec.js tests/oma2-q1-member.spec.js tests/oma2-q3-model-pricing.spec.js --project=chromium --project=webkit-canvas --project=webkit-pricing --grep 'Canvas|P13|@canvas-model-ui' --output=test-results/canvas-artifacts --retries=0 --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.model_status }}" = 'true' ]; then
            export MODEL_STATUS_ASSISTANT="${{ needs.release-compatibility.outputs.model_areas }}"
            rm -f test-results/model-status-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/model-status-discovery.json npm run test:static -- --config playwright.model-status.config.js --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- --config playwright.model-status.config.js --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.workspace_help }}" = 'true' ]; then
            rm -f test-results/workspace-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/workspace-discovery.json npm run test:static -- --config playwright.workspace.config.js --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- --config playwright.workspace.config.js --reporter=list,json
          elif [ "${{ needs.release-compatibility.outputs.public_media }}" = 'true' ]; then
            rm -f test-results/public-media-discovery.json test-results/candidate-auth.json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/public-media-discovery.json npm run test:static -- --config playwright.public-media.config.js --list --reporter=json
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:static -- --config playwright.public-media.config.js --reporter=list,json
          else
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/candidate-auth.json npm run test:auth -- --output=test-results/browser-artifacts --reporter=list,json
          fi
      - name: Confirm tested browser candidate bytes
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pages-candidate.mjs proof
      - name: Upload tested browser candidate identity
        if: needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pages-proof-browser-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-proofs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright report
        if: (needs.release-compatibility.outputs.homepage == 'true' || needs.release-compatibility.outputs.carousel == 'true' || needs.release-compatibility.outputs.assets == 'true' || needs.release-compatibility.outputs.auth == 'true') && failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-selected
          path: |
            playwright-report/
            test-results/
          retention-days: 7
